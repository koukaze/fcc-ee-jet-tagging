[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fcc-ee-jet-tagging"
version = "0.1.0"
description = "Transformer jet-flavour tagging with pairwise attention bias and light-flavour soft fusion"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Peijing Pang"}]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = [
    "numpy>=2.3,<3",
    "pandas>=2.3,<3",
    "matplotlib>=3.10,<4",
    "scikit-learn>=1.7,<2",
    "torch>=2.5,<3",
    "uproot>=5.6,<6",
    "awkward>=2.8,<3",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=7,<8"]
dev = ["pytest>=9,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
